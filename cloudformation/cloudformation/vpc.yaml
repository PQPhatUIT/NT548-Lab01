AWSTemplateFormatVersion: '2010-09-09'
Description: VPC, subnets, IGW
Parameters:
Name: {Type: String}
VpcCidr: {Type: String, Default: 10.0.0.0/16}
PublicSubnetCidr: {Type: String, Default: 10.0.1.0/24}
PrivateSubnetCidr: {Type: String, Default: 10.0.2.0/24}
AZ: {Type: 'AWS::EC2::AvailabilityZone::Name'}
Resources:
Vpc:
Type: AWS::EC2::VPC
Properties:
CidrBlock: !Ref VpcCidr
EnableDnsHostnames: true
Tags: [{Key: Name, Value: !Sub '${Name}-vpc'}]
Igw:
Type: AWS::EC2::InternetGateway
Properties:
Tags: [{Key: Name, Value: !Sub '${Name}-igw'}]
IgwAttach:
Type: AWS::EC2::VPCGatewayAttachment
Properties: {VpcId: !Ref Vpc, InternetGatewayId: !Ref Igw}
PublicSubnet:
Type: AWS::EC2::Subnet
Properties:
VpcId: !Ref Vpc
CidrBlock: !Ref PublicSubnetCidr
AvailabilityZone: !Ref AZ
MapPublicIpOnLaunch: true
Tags: [{Key: Name, Value: !Sub '${Name}-public-subnet'}]
PrivateSubnet:
Type: AWS::EC2::Subnet
Properties:
VpcId: !Ref Vpc
CidrBlock: !Ref PrivateSubnetCidr
AvailabilityZone: !Ref AZTags: [{Key: Name, Value: !Sub '${Name}-private-subnet'}]
Outputs:
VpcId: {Value: !Ref Vpc}
PublicSubnetId: {Value: !Ref PublicSubnet}
PrivateSubnetId: {Value: !Ref PrivateSubnet}
IgwId: {Value: !Ref Igw}
DefaultSecurityGroupId: {Value: !GetAtt Vpc.DefaultSecurityGroup}