AWSTemplateFormatVersion: '2010-09-09'
Description: Elastic IP + NAT Gateway
Parameters:
Name: {Type: String}
PublicSubnetId: {Type: 'AWS::EC2::Subnet::Id'}
Resources:
NatEip:
Type: AWS::EC2::EIP
Properties:
Domain: vpc
Tags: [{Key: Name, Value: !Sub '${Name}-nat-eip'}]
Nat:
Type: AWS::EC2::NatGateway
Properties:
AllocationId: !GetAtt NatEip.AllocationId
SubnetId: !Ref PublicSubnetId
Tags: [{Key: Name, Value: !Sub '${Name}-nat'}]
Outputs:
NatGatewayId: {Value: !Ref Nat}
NatPublicIp: {Value: !Ref NatEip}
