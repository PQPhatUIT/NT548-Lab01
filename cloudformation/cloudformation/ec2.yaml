AWSTemplateFormatVersion: '2010-09-09'
Description: One EC2 instance (dùng cho cả public và private)
Parameters:
InstanceName: {Type: String}
SubnetId: {Type: 'AWS::EC2::Subnet::Id'}
SecurityGroupId: {Type: 'AWS::EC2::SecurityGroup::Id'}
KeyName: {Type: 'AWS::EC2::KeyPair::KeyName'}
InstanceType: {Type: String, Default: t3.micro}
AmiId:
Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
Resources:
Instance:
Type: AWS::EC2::Instance
Properties:
ImageId: !Ref AmiId
InstanceType: !Ref InstanceType
KeyName: !Ref KeyName
SubnetId: !Ref SubnetId
SecurityGroupIds: [!Ref SecurityGroupId]
MetadataOptions: {HttpTokens: required}
BlockDeviceMappings:
- DeviceName: /dev/xvda
Ebs: {Encrypted: true, VolumeType: gp3}
Tags: [{Key: Name, Value: !Ref InstanceName}]
Outputs:
PublicIp: {Value: !GetAtt Instance.PublicIp}
PrivateIp: {Value: !GetAtt Instance.PrivateIp}